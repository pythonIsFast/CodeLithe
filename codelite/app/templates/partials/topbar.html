      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="icon-button" id="sidebar-toggle"
                  title="Toggle sidebar" aria-label="Toggle sidebar" aria-pressed="true">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2" fill="none"
                    stroke="currentColor" stroke-width="1.3" />
              <path d="M6 2.8v10.4" fill="none" stroke="currentColor" stroke-width="1.3" />
            </svg>
          </button>
          <button type="button" class="title-button" id="title-button" title="Session options">
            <span class="title" id="chat-title">No conversation</span>
            <svg class="title-chevron" viewBox="0 0 12 12" width="11" height="11" aria-hidden="true">
              <path d="m3 4.5 3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
        <div class="topbar-actions">
          <button type="button" class="icon-button" id="details-toggle"
                  title="Session details" aria-label="Toggle session details" aria-pressed="true">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2" fill="none"
                    stroke="currentColor" stroke-width="1.3" />
              <path d="M10 2.8v10.4" fill="none" stroke="currentColor" stroke-width="1.3" />
            </svg>
          </button>
          <button type="button" class="icon-button" id="topbar-settings"
                  title="Settings" aria-label="Settings">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <circle cx="3.5" cy="8" r="1.1" fill="currentColor" />
              <circle cx="8" cy="8" r="1.1" fill="currentColor" />
              <circle cx="12.5" cy="8" r="1.1" fill="currentColor" />
            </svg>
          </button>
        </div>
      </header>
