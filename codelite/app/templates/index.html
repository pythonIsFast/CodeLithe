<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CodeLithe</title>
  <link rel="icon" href="{{ url_for('static', filename='icon.png') }}" />
  <link rel="stylesheet" href="{{ url_for('startup_assets', kind='css') }}" />
  <script defer src="{{ url_for('startup_assets', kind='js') }}"></script>
</head>
<body>
  <div class="app" id="app">
    {% include "partials/sidebar.html" %}

    <main class="main">
      {% include "partials/topbar.html" %}

      <div class="content">
        {% include "partials/chat.html" %}
        {% include "partials/details.html" %}
      </div>
    </main>
  </div>

  {% include "partials/dialogs.html" %}
  {% include "partials/auth.html" %}
  {% include "partials/settings.html" %}

  <div class="toast" id="toast" hidden></div>
  <script id="startup-data" type="application/json">{{ startup | tojson }}</script>

</body>
</html>
